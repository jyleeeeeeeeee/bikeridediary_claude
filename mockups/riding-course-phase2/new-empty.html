<!--
  화면명: 코스 신규 생성 — 빈 상태 진입
  요구사항: 2차 스코프 D3 (롱프레스 임의 지점 + 등록 place 선택 둘 다)
  흐름: "라이딩 코스" FAB(+) 클릭 → 이 화면 진입
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRD 목업 — 신규 코스 생성 (빈 상태)</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 이 화면 전용: 지도가 전체 화면의 절반, 하단이 안내 영역 */
    .phone-body {
      display: flex;
      flex-direction: column;
    }

    .map-area {
      height: 300px;
    }

    /* 빈 상태 waypoint 카운터 영역 */
    .empty-counter-bar {
      background: var(--color-card);
      border-bottom: 1px solid var(--color-divider);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .empty-counter-text {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .add-wp-btn {
      height: 34px;
      background: rgba(0,122,255,0.1);
      color: var(--color-primary);
      border: none;
      border-radius: var(--r-full);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .add-wp-btn:hover {
      background: rgba(0,122,255,0.18);
    }
  </style>
</head>
<body>
<div class="phone-wrap">
  <div class="phone">
    <!-- 노치: phone::before -->

    <div class="phone-body">

      <!-- AppBar -->
      <div class="appbar">
        <a href="index.html" class="appbar-back">&#8249;</a>
        <span class="appbar-title">새 코스 만들기</span>
        <!-- 저장 버튼: waypoint 없으면 비활성 -->
        <span class="appbar-action disabled">저장</span>
      </div>

      <!-- 지도 플레이스홀더 (빈 상태: 마커 없음) -->
      <div class="map-area" style="height: 320px;">
        <!-- 격자: map-area::before -->
        <div class="map-label">지도 영역 (Naver Map)</div>

        <!-- 롱프레스 힌트 오버레이 -->
        <div class="map-hint">
          &#128528; 지도를 롱프레스하여 지점 추가
        </div>
      </div>

      <!-- waypoint 카운터 + 하단 추가 버튼 바 -->
      <div class="empty-counter-bar">
        <span class="empty-counter-text">경유지 <strong style="color:var(--color-text-primary)">0</strong> / 15개</span>
        <button class="add-wp-btn" onclick="window.location.href='place-selection-sheet.html'">
          &#43; 등록 장소 선택
        </button>
      </div>

      <!-- 안내 카드 -->
      <div class="guide-card">
        <div class="guide-icon">&#128736;</div>
        <div class="guide-title">코스를 만들어 보세요</div>
        <div class="guide-desc">출발지와 목적지를 추가하면<br>경로를 자동으로 계산해 드립니다.</div>
        <div class="guide-methods">
          <div class="guide-method">
            <strong>&#128205;</strong>
            지도 롱프레스<br>임의 지점 추가
          </div>
          <div class="guide-method">
            <strong>&#128269;</strong>
            등록 장소 선택<br>저장된 POI 추가
          </div>
        </div>
      </div>

      <!-- 규칙 안내 -->
      <div style="margin: 0 16px; padding: 12px 14px; background: rgba(0,122,255,0.06); border-radius: 10px; font-size: 12px; color: #8E8E93; line-height: 1.6;">
        &#8226; START 1개 + VIA 최대 13개 + END 1개 (총 최대 15개)<br>
        &#8226; waypoint 2개 이상이면 "경로 미리보기" 버튼 활성화<br>
        &#8226; 경로 확인 후 저장 버튼이 활성화됩니다
      </div>

      <!-- 하단 여백 (홈 인디케이터 대응) -->
      <div style="flex: 1; min-height: 20px;"></div>

    </div>
    <!-- 홈 인디케이터: phone::after -->
  </div>
</div>

<!-- 프로토타입 네비게이션 -->
<div class="proto-nav">
  <a href="index.html">&#8592; 목록</a>
  <span class="proto-screen-label">화면 01 — 신규 생성 (빈 상태)</span>
  <a href="waypoint-list.html">waypoint 추가 후 &#8594;</a>
</div>

</body>
</html>
